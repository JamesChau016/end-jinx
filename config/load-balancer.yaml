mode: l7

listen:
  host: 0.0.0.0
  port: 9000

strategy: round-robin

healthCheck:
  intervalSeconds: 5
  timeoutMilliseconds: 1000

pools:
  api:
    - host: 127.0.0.1
      port: 8000
    - host: 127.0.0.1
      port: 8001

  static:
    - host: 127.0.0.1
      port: 8001

routes:
  - pathPrefix: /health
    pool: api

  - pathPrefix: /api
    pool: api

  - pathPrefix: /static
    pool: static
